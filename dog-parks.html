<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dog Park Finder</title>
<style>
  :root {
    --bg: #f3f6f2;
    --card: #ffffff;
    --text: #1c2a1f;
    --muted: #5f6f62;
    --accent: #2f7d4a;
    --on-accent: #ffffff;
    --accent-soft: #e2efe5;
    --border: #d7e2d9;
    --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1611;
      --card: #18221b;
      --text: #e7efe9;
      --muted: #9fb0a3;
      --accent: #7fd49a;
      --on-accent: #0f1611;
      --accent-soft: #223428;
      --border: #2b3a2f;
      --error: #ff8a80;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 600px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.8rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form { display: flex; flex-wrap: wrap; gap: 10px; }
  input {
    flex: 1 1 260px;
    min-width: 0;
    font: inherit;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  button {
    flex: 0 0 auto;
    font: inherit;
    font-weight: 600;
    color: var(--on-accent);
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: progress; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { margin: 16px 0 0; color: var(--muted); }
  #status.error { color: var(--error); }
  #results { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
  #results li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .meta { display: flex; gap: 14px; align-items: baseline; flex: none; }
  .dist { font-variant-numeric: tabular-nums; color: var(--muted); }
  a { color: var(--accent); }
  .note { color: var(--muted); font-size: .8rem; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <h1>Dog Park Finder</h1>
  <p class="sub">Enter your address to see every dog park within 1&nbsp;km.</p>

  <form id="form">
    <label for="address" hidden>Your address</label>
    <input id="address" type="text" placeholder="e.g. 10 Downing Street, London" autocomplete="street-address" required>
    <button id="go" type="submit">Find dog parks</button>
  </form>

  <p id="status" role="status"></p>
  <ul id="results"></ul>

  <p class="note">
    Dog park data comes from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors,
    so a park may be missing if nobody has added it yet. Distances are straight-line from your address.
    Your address is sent to OpenStreetMap to look up its location.
  </p>
</main>

<script>
const RADIUS_M = 1000;
const GEOCODER = "https://nominatim.openstreetmap.org/search";
// Overpass servers are often busy, so fall back to a mirror if the main one fails.
const OVERPASS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
];

const form = document.getElementById("form");
const input = document.getElementById("address");
const button = document.getElementById("go");
const status = document.getElementById("status");
const results = document.getElementById("results");

function setStatus(text, isError = false) {
  status.textContent = text;
  status.classList.toggle("error", isError);
}

async function geocode(address) {
  const url = `${GEOCODER}?format=jsonv2&limit=1&q=${encodeURIComponent(address)}`;
  const res = await fetch(url, { headers: { "Accept": "application/json" } });
  if (!res.ok) throw new Error("The address lookup service didn't respond. Try again in a minute.");
  const hits = await res.json();
  if (!hits.length) return null;
  return { lat: Number(hits[0].lat), lon: Number(hits[0].lon), label: hits[0].display_name };
}

async function findDogParks(lat, lon) {
  const query = `[out:json][timeout:25];nwr["leisure"="dog_park"](around:${RADIUS_M},${lat},${lon});out center tags;`;
  for (const server of OVERPASS) {
    try {
      const res = await fetch(server, { method: "POST", body: new URLSearchParams({ data: query }) });
      if (res.ok) return (await res.json()).elements;
    } catch (_) { /* try the next server */ }
  }
  throw new Error("The dog park map service is busy right now. Try again in a minute.");
}

// Great-circle distance in metres.
function distance(lat1, lon1, lat2, lon2) {
  const rad = x => x * Math.PI / 180;
  const a = Math.sin(rad(lat2 - lat1) / 2) ** 2 +
            Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(rad(lon2 - lon1) / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(a));
}

function formatDistance(m) {
  return m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1)} km`;
}

function render(parks) {
  results.replaceChildren();
  for (const p of parks) {
    const li = document.createElement("li");
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = p.name;
    const meta = document.createElement("span");
    meta.className = "meta";
    const dist = document.createElement("span");
    dist.className = "dist";
    dist.textContent = formatDistance(p.distance);
    const link = document.createElement("a");
    link.href = `https://www.openstreetmap.org/?mlat=${p.lat}&mlon=${p.lon}#map=18/${p.lat}/${p.lon}`;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = "Map";
    link.setAttribute("aria-label", `Show ${p.name} on a map`);
    meta.append(dist, link);
    li.append(name, meta);
    results.append(li);
  }
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  const address = input.value.trim();
  if (!address) return;
  results.replaceChildren();
  button.disabled = true;
  try {
    setStatus("Looking up your address…");
    const here = await geocode(address);
    if (!here) {
      setStatus("Couldn't find that address. Try adding the city or postcode.", true);
      return;
    }
    setStatus("Searching for dog parks…");
    const elements = await findDogParks(here.lat, here.lon);
    const parks = elements
      .map(el => {
        const lat = el.lat ?? el.center?.lat;
        const lon = el.lon ?? el.center?.lon;
        return {
          name: el.tags?.name || "Unnamed dog park",
          lat, lon,
          distance: distance(here.lat, here.lon, lat, lon),
        };
      })
      .filter(p => p.lat != null && p.distance <= RADIUS_M)
      .sort((a, b) => a.distance - b.distance);

    const where = `near ${here.label}`;
    if (!parks.length) {
      setStatus(`No dog parks found within 1 km ${where}.`);
    } else {
      setStatus(`${parks.length} dog park${parks.length === 1 ? "" : "s"} within 1 km ${where}:`);
      render(parks);
    }
  } catch (err) {
    setStatus(err.message || "Something went wrong. Try again.", true);
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
